<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocFormatter Agent - AI 智能排版</title>
    <link rel="stylesheet" href="style.css">
    <script src="jszip.min.js"></script>
    <script src="docx-preview.min.js"></script>
</head>
<body>
    <div class="app-container">
        <div class="page-title">AI文档排版助手</div>
        <button id="downloadBtn" class="download-btn" title="下载文档">下载文档</button>

        <div class="content-area">
            <div class="preview-panel">
                <div id="docPreview" class="preview-content">
                    <div class="preview-placeholder">
                        <p>尚未上传文档(若上传解析失败请刷新后再尝试)</p>
                    </div>
                </div>
            </div>

            <div id="sidebarResizer" class="sidebar-resizer" role="separator" aria-label="调整侧边栏宽度" aria-orientation="vertical" tabindex="0"></div>
            <div id="chatPanel" class="chat-panel">
                <div class="chat-header">
                    <h3>AI 排版助手</h3>
                </div>
                <div class="chat-config">
                    <input type="password" id="apiKey" placeholder="DeepSeek API Key">
                    <button id="testConnBtn" class="btn-link">测试连接</button>
                </div>
                <div class="spec-config">
                    <select id="specSelect" hidden aria-hidden="true">
                        <option value="general">通用规范</option>
                        <option value="academic_gb">学术论文</option>
                    </select>
                    <div id="specDropdown" class="spec-dropdown">
                        <button id="specDropdownTrigger" class="spec-dropdown-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                            <span id="specDropdownLabel">通用规范</span><span class="spec-chevron">⌄</span>
                        </button>
                        <div id="specDropdownMenu" class="spec-dropdown-menu" role="listbox" hidden></div>
                    </div>
                    <button id="refreshSpecBtn" class="btn-link" title="刷新规范列表">↻</button>
                </div>
                <div id="statusBar" class="status-bar idle" style="display:none"></div>
                <div class="chat-messages" id="chatMessages">
                    <div class="message system">请按：1) 填入 API Key 并测试连接；2) 上传一个 .docx 文档；3) 输入排版指令开始对话。</div>
                </div>
            </div>
        </div>

        <div class="floating-input-bar">
            <div id="attachmentShelf" class="attachment-shelf" aria-live="polite" hidden>
                <div id="documentAttachment" class="attachment-card" hidden>
                    <span class="attachment-icon">W</span>
                    <span class="attachment-copy"><b>待排版文档</b><span id="documentFileName"></span></span>
                    <span class="attachment-state">已解析</span>
                </div>
                <div id="templateAttachment" class="attachment-card template" hidden>
                    <span class="attachment-icon">T</span>
                    <span class="attachment-copy"><b>排版模板</b><span id="templateFileName"></span></span>
                    <span class="attachment-state">已逆向</span>
                </div>
            </div>
            <div class="input-row">
                <input type="file" id="uploadInput" accept=".docx" hidden>
                <input type="file" id="templateInput" accept=".docx" hidden>
                <div id="uploadChooser" class="upload-chooser">
                    <div class="upload-menu" role="radiogroup" aria-label="选择上传类型">
                        <label class="upload-option">
                            <input type="radio" name="uploadType" value="document" checked>
                            <span><b>上传需排版的文档</b><small>上传后进行解析和预览</small></span>
                        </label>
                        <label class="upload-option">
                            <input type="radio" name="uploadType" value="template">
                            <span><b>上传模板</b><small>逆向提取模板排版规范</small></span>
                        </label>
                    </div>
                    <button id="uploadBtn" class="upload-pill-btn" title="上传需排版的文档" aria-label="选择并上传文档" aria-haspopup="true">+</button>
                </div>
                <div class="input-wrapper">
                    <input type="text" id="userInput" placeholder="点击“+”上传文档" readonly>
                </div>
                <select id="model" class="model-select">
                    <option value="deepseek-chat">deepseek-chat</option>
                    <option value="deepseek-reasoner">deepseek-reasoner</option>
                    <option value="deepseek-coder">deepseek-coder</option>
                </select>
                <button id="sendBtn" class="send-btn">→</button>
            </div>
        </div>
    </div>

    <script src="chat.js"></script>
</body>
</html>
